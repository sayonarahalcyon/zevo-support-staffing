name: Notion leave backup

# Copies the vacation leave log from Supabase into the Notion backup database
# every night, and can be run by hand from the Actions tab. It also catches up
# any leave the app could not copy to Notion at the moment it was saved.
on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily (4:17 AM US Central)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python sync_notion.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LEAVE_DB_ID: ${{ secrets.NOTION_LEAVE_DB_ID }}
